name: Retry build

# GitHub's macOS runners are sometimes all busy; the iOS job is then dropped
# ("not acquired by Runner") and the run shows as failed. Re-run it once.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
