name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s server -p "test_*.py"

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Every release must carry the same key, or phones refuse the update.
      - name: Release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KOSMOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the KOSMOS_KEYSTORE_* secrets (see README, Releases)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KOSMOS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KOSMOS_KEYSTORE_PASSWORD: ${{ secrets.KOSMOS_KEYSTORE_PASSWORD }}
          KOSMOS_KEY_ALIAS: ${{ secrets.KOSMOS_KEY_ALIAS }}
          KOSMOS_KEY_PASSWORD: ${{ secrets.KOSMOS_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk kosmos3d.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kosmos3d-android-apk
          path: kosmos3d.apk

      # main publishes a release; the link .../releases/latest/download/kosmos3d.apk
      # always points to the newest APK.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          tag="v$version-build.${{ github.run_number }}"
          gh release create "$tag" kosmos3d.apk \
            --title "KOSMOS 3D $version (build ${{ github.run_number }})" \
            --notes "Android: open this page on the phone, tap kosmos3d.apk and install. Commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" --latest

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # An unsigned .ipa. Sign it with your Apple ID (Sideloadly, AltStore)
      # or open ios/Runner.xcworkspace in Xcode and sign with your team.
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry kosmos3d-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: kosmos3d-ios-unsigned-ipa
          path: kosmos3d-unsigned.ipa
